# .github/workflows/release.yml

name: Release

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  # - Version
  version:
    name: "Bump Version"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      new: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: "Bump patch version"
        id: bump
        run: |
          # Read current version
          CURRENT=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "Current version: $CURRENT"

          # Split into major.minor.patch
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          NEW_TAG="v${NEW_VERSION}"

          # Ensure the tag does not already exist on remote (increment until we find a free one)
          while git ls-remote --tags origin | grep -q "refs/tags/${NEW_TAG}$"; do
            echo "Tag ${NEW_TAG} already exists on remote. Incrementing patch version..."
            NEW_PATCH=$((NEW_PATCH + 1))
            NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
            NEW_TAG="v${NEW_VERSION}"
          done

          echo "New version: $NEW_VERSION"
          echo "New tag: $NEW_TAG"

          # Update Cargo.toml
          sed -i "s/version = \"${CURRENT}\"/version = \"${NEW_VERSION}\"/" Cargo.toml

          # Update Cargo.lock
          cargo generate-lockfile

          # Commit and tag
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: release v${NEW_VERSION}"
          git tag "${NEW_TAG}"
          git push origin main --tags

          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"

  # - Build
  build:
    name: "Build (${{ matrix.target }})"
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: bytecore-linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: bytecore-linux-arm64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: bytecore-macos-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: bytecore-windows-amd64.exe
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - name: "Install cross"
        if: matrix.target != 'x86_64-unknown-linux-gnu' && runner.os == 'Linux'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: "Install SDL2 (Linux native)"
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: "Build (native)"
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo build --release --locked --all-features --target ${{ matrix.target }}

      - name: "Build (cross)"
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --locked --all-features --target ${{ matrix.target }}

      - name: "Rename binary (Linux/macOS)"
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/bytecore ${{ matrix.artifact }}

      - name: "Rename binary (Windows)"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "target/${{ matrix.target }}/release/bytecore.exe" "${{ matrix.artifact }}"

      - name: "Upload artifact"
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  # - Release
  release:
    name: "Create Release"
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Download binaries"
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: bytecore-*

      - name: "List artifacts"
        run: ls -lR artifacts

      - name: "Create GitHub Release"
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: "Bytecore ${{ needs.version.outputs.tag }}"
          generate_release_notes: true
          files: |
            artifacts/**/*

  # - Docker
  docker:
    name: "Docker (${{ matrix.variant }})"
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: "terminal"
            dockerfile: "Dockerfile"
            tag_suffix: ""
          - variant: "sdl2"
            dockerfile: "Dockerfile.sdl2"
            tag_suffix: "sdl2-"
    steps:
      - uses: actions/checkout@v7

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v4

      - name: "Login to ghcr.io"
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Docker metadata"
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ matrix.tag_suffix }}latest
            type=raw,value=${{ matrix.tag_suffix }}v${{ needs.version.outputs.new }}

      - name: "Build and push"
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
