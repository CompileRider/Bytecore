# .github/workflows/ci.yml

name: Rust CI

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: "Check Formatting"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt

      - run: cargo fmt --all -- --check

  lint:
    name: "Clippy (${{ matrix.features }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: "default"
            args: ""
          - features: "all"
            args: "--all-features"
          - features: "sdl2"
            args: "--no-default-features --features sdl2"
          - features: "terminal"
            args: "--no-default-features --features terminal"
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy

      - name: "Install SDL2 (Linux)"
        if: matrix.features == 'sdl2' || matrix.features == 'all' || matrix.features == 'default'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: "Run Clippy"
        run: cargo clippy --locked ${{ matrix.args }} --all-targets -- -D warnings

  test:
    name: "Test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: "Install SDL2 (Linux)"
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: "Install SDL2 (macOS)"
        if: runner.os == 'macOS'
        run: |
          brew install sdl2
          echo "LIBRARY_PATH=/opt/homebrew/lib" >> $GITHUB_ENV

      - name: "Install SDL2 (Windows)"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install sdl2:x64-windows
          $vcpkg_root = $env:VCPKG_INSTALLATION_ROOT
          echo "VCPKG_ROOT=$vcpkg_root" >> $env:GITHUB_ENV
          echo "$vcpkg_root\installed\x64-windows\bin" >> $env:GITHUB_PATH
          echo "SDL2_DIR=$vcpkg_root\installed\x64-windows" >> $env:GITHUB_ENV
          echo "SDL2_LIB_DIR=$vcpkg_root\installed\x64-windows\lib" >> $env:GITHUB_ENV
          echo "SDL2_INCLUDE_DIR=$vcpkg_root\installed\x64-windows\include" >> $env:GITHUB_ENV

      - name: "Build"
        run: cargo build --locked --all-features --verbose

      - name: "Test"
        run: cargo test --locked --all-features --verbose
