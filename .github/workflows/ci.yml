# .github/workflows/ci.yml

name: Rust CI


# - Triggers

on:
  push:
    branches: ["main"]
    # Only run CI if Rust files are changed
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["main"]
    # Only run CI if Rust files are changed
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"


# - Permissions

permissions:
  contents: read


# - Jobs

jobs:
  format:
    name: "Check Formatting"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Install Rust Toolchain"
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt

      - name: "Run rustfmt"
        run: cargo fmt --all -- --check

  lint:
    name: "Linting (Clippy)"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Install Rust Toolchain"
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      
      - name: "Install SDL2"
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: "Run Clippy (Default Features)"
        run: cargo clippy -- -D warnings

      - name: "Run Clippy (All Features)"
        run: cargo clippy --all-features -- -D warnings
      
      - name: "Run Clippy (SDL2 only)"
        run: cargo clippy --no-default-features --features sdl2 -- -D warnings

      - name: "Run Clippy (Terminal only)"
        run: cargo clippy --no-default-features --features terminal -- -D warnings

  test:
    name: "Testing"
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Install Rust Toolchain"
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: "Cache dependencies"
        uses: Swatinem/rust-cache@v2

      - name: "Install SDL2 (Linux)"
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: "Build Project"
        run: cargo build --all-features --verbose

      - name: "Run Tests"
        run: cargo test --all-features --verbose
