[package]
name = "chip8-emu"
version = "0.1.0"
edition = "2024"
description = "A Chip-8 emulator virtual machine built in Rust"
authors = ["CompileRider"]
license = "MIT"
keywords = ["emulator", "chip8", "retro", "gaming"]
categories = ["emulators", "games"]

[dependencies]
# For managing CPU state flags and other boolean sets.
bitflags = "2.13.0"
# For creating custom, descriptive error types.
thiserror = "2.0.18"

# Framework for serializing and deserializing Rust data structures for the quirks system.
serde = { version = "1.0.228", features = ["derive"] }
# TOML parsing for configuration files.
toml = "=0.9.12"

# Provides graphics, audio, and input for the graphical frontend.
sdl2 = { version = "0.38.0", optional = true }
# Used to build rich Terminal User Interfaces (TUIs).
ratatui = { version = "0.30.2", optional = true }
# Backend for ratatui, provides terminal manipulation capabilities.
crossterm = { version = "0.29.0", optional = true }

# Feature flags to enable modular backends.
[features]
default = ["terminal"]
sdl2 = ["dep:sdl2"]
terminal = ["dep:ratatui", "dep:crossterm"]

# Release profile optimizations for a smaller and faster binary.
[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
